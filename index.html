<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* Background */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
    url("https://images.unsplash.com/photo-1581092918056-0c4c3acd3789");
  background-size: cover;
  z-index: -1;
}

/* Navbar */
nav {
  background: linear-gradient(90deg, orange, white, green);
  padding: 15px;
  text-align: center;
}
nav a {
  margin: 15px;
  color: black;
  font-weight: bold;
}

/* Hero */
.hero {
  text-align: center;
  padding: 80px;
}

/* Cards */
.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}
.card {
  background: rgba(0,0,0,0.8);
  padding: 20px;
  margin: 10px;
  width: 260px;
  border: 1px solid green;
  box-shadow: 0 0 10px green;
}

/* Waveform */
.wave-container {
  width: 90%;
  margin: auto;
  background: black;
  border: 2px solid green;
  padding: 20px;
}
.signal {
  height: 30px;
  margin: 10px;
  position: relative;
}
.signal::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 100%;
  background: repeating-linear-gradient(
    90deg,
    lime 0px,
    lime 20px,
    transparent 20px,
    transparent 40px
  );
  animation: moveWave 2s linear infinite;
}
@keyframes moveWave {
  from {transform: translateX(0);}
  to {transform: translateX(-200px);}
}

/* Document */
.doc-box {
  text-align: center;
  padding: 20px;
}
button {
  padding: 10px 20px;
  margin: 10px;
  background: green;
  border: none;
  color: white;
}
</style>
</head>
